<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1S · Fragrance Library</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://alcdn.msauth.net">
<style>
:root{
  --ink:#16202c; --muted:#5f6c7d;
  --glass:rgba(255,255,255,.62); --edge:rgba(255,255,255,.75);
  --shadow:0 8px 32px rgba(31,45,75,.12);
  --accentink:#1b6fae; --sel:#1b6fae; --grid:rgba(95,108,125,.16);
  --good:#2f7d4f; --good-soft:rgba(63,125,88,.15);
  --warn:#9a6b2f; --warn-soft:rgba(154,107,47,.13);
  --bad:#b4452f; --bad-soft:rgba(180,69,47,.12);
  --ring:rgba(47,155,214,.18);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.45;color:var(--ink);
  background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
#flow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));flex:0 0 auto;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--edge);box-shadow:0 2px 14px rgba(31,45,75,.06);
}
.brand{font-weight:700;font-size:15px}
.brand span{color:var(--muted);font-weight:400;margin-left:9px;font-size:12px}
.spacer{flex:1}
.who{font-size:12.5px;color:var(--muted)}
button{font-family:inherit;cursor:pointer}
.btn{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:11px;border:1px solid var(--edge);background:rgba(255,255,255,.75);color:var(--ink);white-space:nowrap}
.btn:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{color:#fff;background:linear-gradient(135deg,#2f9bd6,#1b6fae);border:1px solid var(--edge)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{color:#fff;background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.seg{display:inline-flex;background:rgba(255,255,255,.55);border:1px solid var(--edge);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 13px;border-radius:9px;display:flex;align-items:center;gap:7px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(31,45,75,.1)}
.seg b{font-size:11px;font-weight:700;color:var(--accentink);background:rgba(47,155,214,.14);border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.seg b.warn{color:var(--warn);background:var(--warn-soft)}
.main{flex:1;overflow:auto;padding-block:18px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow)}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.8);border:1px solid var(--edge);border-radius:11px;padding:8px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{background:#fff;box-shadow:0 0 0 3px var(--ring)}
label.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
label.fld > span{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px}
.tools .q{flex:1 1 240px;max-width:360px}
.tools select{width:auto;min-width:170px}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
.inline-load{display:flex;align-items:center;gap:9px;padding:16px;color:var(--muted);font-size:12.5px}
.spin{width:15px;height:15px;border:2px solid var(--ring);border-top-color:var(--accentink);border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.save{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.save.err{color:var(--bad);font-weight:600}
.save .spin{width:12px;height:12px}
.banner{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--edge);color:var(--warn);font-size:12.5px;flex-wrap:wrap}
.banner.demo{background:rgba(47,155,214,.13);color:var(--accentink)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.hint{font-size:11.5px;color:var(--muted)}
.err-line{font-size:12px;color:var(--bad);font-weight:600;min-height:16px}
.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f0fa 0%,#f3eef9 45%,#eaf6f1 100%)}
.gate .card{padding:32px 40px;text-align:center;display:flex;flex-direction:column;gap:15px;align-items:center;max-width:440px}

/* library grid */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
.fcard{overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .13s,box-shadow .13s}
.fcard:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(31,45,75,.16)}
.fimg{aspect-ratio:1/1;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--grid)}
.fimg{position:relative}
.fimg img{width:100%;height:100%;object-fit:contain;display:block}
.zoom{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:9px;border:1px solid var(--edge);background:rgba(255,255,255,.9);color:var(--ink);font-size:14px;line-height:1;opacity:0;transition:opacity .13s}
.fcard:hover .zoom,.zoom:focus{opacity:1}
.zoom:hover{background:#fff;color:var(--accentink)}
@media (hover:none){.zoom{opacity:1}}
.fimg .none{font-size:11px;color:var(--muted)}
.fbd{padding:10px 13px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fname{font-weight:700;font-size:13.5px;line-height:1.3;min-height:2.6em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fmeta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pill.b{background:rgba(47,155,214,.16);color:var(--accentink)}
.pill.m{background:rgba(95,108,125,.14);color:var(--muted)}
.pill.g{background:var(--good-soft);color:var(--good)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.alc{background:rgba(242,115,74,.14);color:#a8452a}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.dropcol{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;width:200px}
.ocrline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);line-height:1.35}
.ocrline .spin{width:12px;height:12px}
.ocrline.ok{color:var(--accentink)}
.ocrline.bad{color:var(--bad)}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input.auto,select.auto{background:rgba(47,155,214,.10);box-shadow:inset 0 0 0 1px rgba(47,155,214,.4)}
.facl{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;margin-top:8px;border:1px solid var(--edge);border-radius:12px;background:rgba(255,255,255,.55);padding:4px}
.facr{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px;cursor:pointer}
.facr:hover{background:#fff}
.facr input{width:16px;height:16px;accent-color:var(--accentink);flex:0 0 auto}
.linkbtn{border:none;background:none;padding:0;font-size:12px;font-weight:600;color:var(--accentink);text-align:left;cursor:pointer}
.linkbtn:hover{text-decoration:underline}

/* styles table */
.tbl-scroll{overflow:auto;max-width:100%;max-height:calc(100vh - 190px);border-radius:18px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:middle}
thead th{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(240,245,251,.97);position:sticky;top:0;z-index:2;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.78)}
tbody tr:last-child td{border-bottom:none}
td.ph-c{width:1%}
td.sty{font-weight:700;white-space:nowrap}
td.desc{min-width:220px;max-width:420px}
td.src{white-space:nowrap}
td.src .pill{margin-right:4px}
td.act{text-align:right;white-space:nowrap}
.ph{width:44px;height:44px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid var(--edge);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.load{background:linear-gradient(100deg,rgba(255,255,255,.5) 30%,#fff 50%,rgba(255,255,255,.5) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.ph .none{font-size:9px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.85);border:1px solid var(--edge);border-radius:999px;padding:2px 10px 2px 2px;font-size:12px;font-weight:600;max-width:240px;box-shadow:0 1px 4px rgba(31,45,75,.06)}
.chip img,.chip .dot{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:rgba(95,108,125,.14)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.gone{color:var(--bad)}
.chip b.alc{font-size:10.5px;color:#a8452a;background:rgba(242,115,74,.14);border-radius:999px;padding:0 6px;flex:0 0 auto}
.chip .x{border:none;background:none;color:var(--muted);font-size:13px;line-height:1;padding:0 0 0 2px}
.chip .x:hover{color:var(--bad)}
.pick{border:1px dashed rgba(95,108,125,.4);background:rgba(255,255,255,.5);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600}
.pick:hover{border-color:var(--accentink);color:var(--accentink);background:#fff}
.srcbar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.srcbar .spin{width:12px;height:12px}

/* dialogs */
dialog{margin:auto;border:1px solid var(--edge);border-radius:18px;padding:0;max-width:460px;width:92vw;background:rgba(255,255,255,.94);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow);color:var(--ink)}
dialog::backdrop{background:rgba(22,32,44,.28);backdrop-filter:blur(3px)}
dialog.wide{max-width:860px;width:94vw}
dialog.mid{max-width:640px}
.dlg-hd{padding:15px 18px 0;font-size:15px;font-weight:700}
.dlg-hd .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.dlg-bd{padding:15px 18px;display:flex;flex-direction:column;gap:13px}
.dlg-ft{display:flex;align-items:center;gap:9px;padding:0 18px 16px}
.frow{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.frow .fields{flex:1 1 260px;display:flex;flex-direction:column;gap:12px;min-width:0}
.drop{width:200px;height:200px;border-radius:14px;border:1.5px dashed rgba(95,108,125,.4);background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;padding:10px}
.drop:hover,.drop.over{border-color:var(--accentink);background:#fff;color:var(--accentink)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.drop .rep{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;background:rgba(255,255,255,.92);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;color:var(--ink);white-space:nowrap}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:2px}
.ptile{border:1px solid var(--edge);border-radius:13px;background:rgba(255,255,255,.75);overflow:hidden;cursor:pointer;position:relative;text-align:left;padding:0;display:flex;flex-direction:column}
.ptile:hover{background:#fff}
.ptile.on{box-shadow:0 0 0 2.5px var(--sel);background:#fff}
.ptile .im{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted)}
.ptile .im img{width:100%;height:100%;object-fit:contain}
.ptile .tx{padding:6px 8px 8px;font-size:11.5px;font-weight:700;line-height:1.3}
.ptile .tx small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile .ck{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--sel);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center}
.ptile.on .ck{display:flex}
dialog.lb{max-width:92vw;max-height:92vh;padding:10px;background:#fff;cursor:zoom-out;width:auto}
dialog.lb img{display:block;max-width:calc(92vw - 20px);max-height:calc(92vh - 50px);object-fit:contain;margin:0 auto}
.lb-cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
@media (max-width:640px){.dropcol{width:100%}.main{padding-block:12px 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.drop{width:100%;height:220px}.tools select{min-width:0;flex:1 1 120px}.fgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#flow{display:none}}
</style>
</head>
<body>
<canvas id="flow"></canvas>

<div class="gate" id="gate">
  <div class="card">
    <div>
      <div style="font-size:19px;font-weight:700">Fragrance Library</div>
      <div style="color:var(--muted);font-size:12.5px;margin-top:4px">Metro1 Solutions</div>
    </div>
    <div id="gateMsg" class="inline-load"><div class="spin"></div>Checking your session…</div>
    <button class="btn primary" id="signIn" style="display:none">Sign in with Microsoft</button>
    <button class="btn" id="demoBtn" style="display:none">View demo with sample data</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <div class="brand">M1S Fragrance Library<span>factory samplers · scents by style</span></div>
    <div class="seg" id="tabs">
      <button data-v="lib">Library <b id="cLib">0</b></button>
      <button data-v="sty">Styles <b id="cSty">0</b></button>
    </div>
    <div class="spacer"></div>
    <div class="save" id="save"></div>
    <div class="who" id="whoName"></div>
  </div>
  <div class="main"><div class="wrap" id="view"></div></div>
</div>

<dialog id="fDlg" class="mid"></dialog>
<dialog id="pDlg" class="wide"></dialog>
<dialog id="aDlg"></dialog>
<dialog id="lbDlg" class="lb" onclick="this.close()"><img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div></dialog>
<input type="file" id="imgPick" accept="image/*" style="display:none">

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script>
"use strict";

/* ============================== CONFIG ============================== */
const CFG = {
  clientId : "4f09444a-97b0-45b8-a20c-f9fa4a3e0122",
  tenantId : "eeea7e3e-9ccb-4a16-894e-3417c6a7a4c1",
  host     : "met1sol.sharepoint.com",
  sitePath : "/sites/Production",
  scopes   : ["User.Read", "Sites.ReadWrite.All"],
  manageScopes : ["Sites.Manage.All"],          // only asked for when creating the two lists

  listLib       : "Fragrance_Library",          // one row per sampler fragrance
  listMap       : "Style_Scents",               // one row per style → fragrance id(s)
  listFactories : "Factories",
  listTracker   : "Qoute_Tracker",              // internal-name typo is real
  trackerAlt    : "Quote_Tracker",
  listUpc       : "UPC_MASTER",

  imgDrive      : "Documents",
  fullPath      : "Fragrance Library/full",     // <id>.jpg, 1400px
  quoteImgPath  : "Quote Sheets/Quote Images",  // style photos, shared with Quote Tracker
  thumbPx       : 220,                          // stored in the list row as a JPEG data URL
  ocr : {                                       // label reader (Tesseract), loaded the first time a photo is added
    lib    : "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
    worker : "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
    core   : "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
    lang   : "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int",
    langFile : ""                               // optional: one file with the language data, fetched by the page itself
  }
};
const LIB_COLS = ["Title","Factory","FactoryCode","Thumb"];
const MAP_COLS = ["Title","StyleKey","FragranceIds","FragranceNames"];
const IS_FRAG = /fragran/i;
const G = "https://graph.microsoft.com/v1.0";

const keyOf = s => String(s || "").toUpperCase().replace(/[^A-Z0-9_-]/g, "");
const normName = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase();
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const splitIds = v => String(v || "").split(/[;,\s]+/).filter(Boolean);
const byText = (a, b) => String(a).localeCompare(String(b), undefined, { numeric:true, sensitivity:"base" });
const $ = s => document.querySelector(s);
function el(t, c, txt){ const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]); }

/* ============================== STATE =============================== */
const S = {
  acct:null, siteId:null, lists:{}, drive:null,
  cols:{ lib:{}, map:{} }, missing:[], idxWarn:"",
  lib:[], libById:new Map(),
  map:new Map(), dupes:new Map(),                 // styleKey → { itemId, style, key, ids[] }
  factories:[], facErr:"",
  src:{ qt:[], upc:[], qtState:"idle", upcState:"idle", upcRead:0, qtErr:"", upcErr:"" },
  manual:new Map(), styles:[], photos:new Map(),
  view:"lib", q:"", fac:"", sf:"missing", sq:""
};

/* ============================== MSAL ================================ */
const redirectUri = window.location.origin + window.location.pathname;
const msalApp = window.msal ? new msal.PublicClientApplication({
  auth:{ clientId:CFG.clientId, authority:"https://login.microsoftonline.com/" + CFG.tenantId, redirectUri },
  cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false }
}) : null;
const framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

async function getToken(scopes){
  if (DEMO) return "demo";
  scopes = scopes || CFG.scopes;
  try { return (await msalApp.acquireTokenSilent({ scopes, account:S.acct })).accessToken; }
  catch(e){
    if (framed) return (await msalApp.acquireTokenPopup({ scopes })).accessToken;
    msalApp.acquireTokenRedirect({ scopes });
    return new Promise(() => {});
  }
}

/* ============================== GRAPH =============================== */
async function gf(path, opts){
  opts = opts || {};
  if (DEMO) return demoGraph(path, opts);
  const tok = await getToken(opts.scopes);
  const h = Object.assign({ Authorization:"Bearer " + tok }, opts.headers || {});
  if (opts.body && typeof opts.body === "string" && !h["Content-Type"]) h["Content-Type"] = "application/json";
  const url = /^https?:/.test(path) ? path : G + path;
  const res = await fetch(url, { method:opts.method || "GET", headers:h, body:opts.body, signal:opts.signal });
  if (res.status === 429 || res.status === 503){
    await new Promise(r => setTimeout(r, parseInt(res.headers.get("Retry-After") || "3", 10) * 1000));
    return gf(path, opts);
  }
  if (!res.ok){
    const txt = await res.text().catch(() => "");
    let msg = txt; try { msg = JSON.parse(txt).error.message || txt; } catch(e){}
    const err = new Error("Graph " + res.status + " — " + String(msg).slice(0, 240));
    err.status = res.status; throw err;
  }
  if (res.status === 204 || res.status === 202) return null;
  const ct = res.headers.get("Content-Type") || "";
  return ct.indexOf("json") >= 0 ? res.json() : null;
}
async function gAll(path, onPage){
  const out = []; let next = path;
  while (next){
    const p = await gf(next);
    if (p && p.value) out.push.apply(out, p.value);
    if (onPage) onPage(out.length);
    next = p && p["@odata.nextLink"] ? p["@odata.nextLink"] : null;
  }
  return out;
}

async function resolveSite(){
  const s = await gf("/sites/" + CFG.host + ":" + CFG.sitePath);
  S.siteId = s.id; S.lists = {};
  const lists = await gAll("/sites/" + S.siteId + "/lists?$select=id,name,displayName&$top=300");
  lists.forEach(l => [l.name, l.displayName].forEach(n => { S.lists[n] = l.id; S.lists[String(n).toLowerCase()] = l.id; }));
  const drives = await gAll("/sites/" + S.siteId + "/drives?$select=id,name");
  const d = drives.find(x => x.name === CFG.imgDrive);
  S.drive = d ? d.id : (drives[0] && drives[0].id) || null;

/* Map canonical names to real internal names (handles the trailing digit SharePoint
   adds on a clash, casing drift, and lists built by hand with display names). */
async function resolveCols(listName, canon){
  const cols = await gAll("/sites/" + S.siteId + "/lists/" + listId(listName) + "/columns?$select=name,displayName,readOnly&$top=300");
  const strip = s => String(s).replace(/\d+$/, "").replace(/[\s_]/g, "").toLowerCase();
  const out = {}, miss = [];
  canon.forEach(k => {
    const lk = k.toLowerCase(), sk = strip(k);
    const hit = cols.find(c => c.name === k) || cols.find(c => String(c.name).toLowerCase() === lk)
      || cols.find(c => strip(c.name) === sk) || cols.find(c => strip(c.displayName) === sk);
    if (hit) out[k] = hit.name; else miss.push(k);
  });
  return { out, miss };
}

/* Fragrance-category styles come from Quote Tracker and UPC_MASTER. Both are read
   whole (UPC_MASTER is past the 5,000 threshold, so no $filter on Category) in the
   background; the last result is cached so the Styles tab opens instantly. */
async function loadSources(){
  try {
    const c = DEMO ? null : JSON.parse(localStorage.getItem("fl-src") || "null");
    if (c && c.qt && c.upc){ S.src.qt = c.qt; S.src.upc = c.upc; rebuildStyles(); }
  } catch(e){}
  S.src.qtState = S.src.upcState = "loading"; S.src.upcRead = 0; schedRender();
  await Promise.all([
    readQT().then(r => { S.src.qt = r; S.src.qtState = "ok"; }).catch(e => { S.src.qtState = "err"; S.src.qtErr = e.message; }),
    readUPC().then(r => { S.src.upc = r; S.src.upcState = "ok"; }).catch(e => { S.src.upcState = "err"; S.src.upcErr = e.message; })
  ]);
  if (!DEMO && S.src.qtState === "ok" && S.src.upcState === "ok"){
    try { localStorage.setItem("fl-src", JSON.stringify({ qt:S.src.qt, upc:S.src.upc, at:Date.now() })); } catch(e){}
  }
  rebuildStyles(); schedRender(); loadPhotos();
}
async function readQT(){
  const name = listId(CFG.listTracker) ? CFG.listTracker : CFG.trackerAlt;
  if (!listId(name)) throw new Error("Quote Tracker list not found");
  const rows = await gAll(itemsPath(name) + "?$expand=fields($select=Title,Descr,Category,ImgKey,Archived)&$top=999");
  const out = [];
  rows.forEach(r => {
    const f = r.fields || {};
    if (!IS_FRAG.test(String(f.Category || "")) || f.Archived === true) return;
    const style = String(f.Title || "").trim();
    if (style) out.push({ style, desc:String(f.Descr || "").trim(), img:keyOf(f.ImgKey || style) });
  });
  return out;
}
async function readUPC(){
  if (!listId(CFG.listUpc)) throw new Error("UPC_MASTER list not found");
  const { out:c, miss } = await resolveCols(CFG.listUpc, ["Style","Description","Category"]);
  if (miss.indexOf("Style") >= 0 || miss.indexOf("Category") >= 0) throw new Error("UPC_MASTER is missing a Style or Category column");
  const sel = [c.Style, c.Description, c.Category].filter(Boolean).join(",");
  const rows = await gAll(itemsPath(CFG.listUpc) + "?$expand=fields($select=" + sel + ")&$top=999", n => { S.src.upcRead = n; schedRender(); });
  const seen = new Map();
  rows.forEach(r => {
    const f = r.fields || {};
    if (!IS_FRAG.test(String(f[c.Category] || ""))) return;
    const style = String(f[c.Style] || "").trim(), k = keyOf(style);
    if (k && !seen.has(k)) seen.set(k, { style, desc:String((c.Description && f[c.Description]) || "").trim(), img:k });
  });
  return Array.from(seen.values());
}
function rebuildStyles(){
  const m = new Map();
  const add = (r, src) => {
    const k = keyOf(r.style); if (!k) return;
    const x = m.get(k) || m.set(k, { key:k, style:r.style, desc:"", img:r.img || k, src:new Set() }).get(k);
    if (!x.desc && r.desc) x.desc = r.desc;
    if (src === "QT" && r.img) x.img = r.img;
    x.src.add(src);
  };
  S.src.qt.forEach(r => add(r, "QT"));
  S.src.upc.forEach(r => add(r, "UPC"));
  S.map.forEach(r => { if (!m.has(r.key)) add({ style:r.style }, "Manual"); });
  S.manual.forEach(r => { if (!m.has(r.key)) add(r, "Manual"); });
  S.styles = Array.from(m.values()).sort((a, b) => byText(a.style, b.style));
}
async function loadPhotos(){
  if (!S.drive) return;
  const keys = [], seen = new Set();
  S.styles.forEach(s => { if (s.img && !seen.has(s.img) && !S.photos.has(s.img)){ seen.add(s.img); keys.push(s.img); } });
  const jobs = []; for (let i = 0; i < keys.length; i += 20) jobs.push(keys.slice(i, i + 20));
  let idx = 0;
  const worker = async () => {
    while (idx < jobs.length){
      const ks = jobs[idx++];
      const requests = ks.map((k, i) => ({ id:String(i + 1), method:"GET",
        url:"/drives/" + S.drive + "/root:/" + encPath(CFG.quoteImgPath) + "/thumb/" + encodeURIComponent(k) + ".jpg" }));
      try {
        const res = await gf("/$batch", { method:"POST", body:JSON.stringify({ requests }) });
        (res.responses || []).forEach(r => S.photos.set(ks[Number(r.id) - 1], (r.status === 200 && r.body && r.body["@microsoft.graph.downloadUrl"]) || null));
      } catch(e){ ks.forEach(k => S.photos.set(k, null)); }
      schedRender();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

let saving = 0;
function setSave(state, msg){
  const n = $("#save"); n.className = "save"; n.innerHTML = "";
  if (state === "busy"){ n.appendChild(el("div", "spin")); n.appendChild(el("span", null, "Saving…")); }
  else if (state === "ok"){ n.textContent = "All changes saved"; }
  else if (state === "err"){ n.className = "save err"; n.textContent = msg || "Save failed"; }
}
async function track(p){
  saving++; setSave("busy");
  try { const r = await p; if (--saving === 0) setSave("ok"); return r; }
  catch(e){ saving--; if (e.name === "AbortError"){ if (!saving) setSave("ok"); } else setSave("err", e.message); throw e; }
}

/* A rename rewrites FragranceNames on every style using it, so other tools and

/* ============================== IMAGES ============================== */
function decodeImage(file){
  return new Promise((ok, bad) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.src = fr.result; };
    fr.onerror = () => bad(new Error("Cannot read file"));
    img.onload = () => ok(img);
    img.onerror = () => bad(new Error("Cannot decode this image (HEIC isn't supported — save it as JPG or PNG)"));
    fr.readAsDataURL(file);
  });
}
function drawTo(img, max){
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function thumbUrl(img){
  const c = drawTo(img, CFG.thumbPx);
  let q = .74, u = c.toDataURL("image/jpeg", q);
  while (u.length > 40000 && q > .4){ q -= .08; u = c.toDataURL("image/jpeg", q); }
  return u;
}
const fullBlob = img => new Promise((ok, bad) => drawTo(img, 1400).toBlob(b => b ? ok(b) : bad(new Error("Encode failed")), "image/jpeg", .86));

/* =========================== LABEL READER ===========================
   Tesseract runs in the browser, loaded the first time a photo is added. The photo
   is greyscaled and Otsu-thresholded first; if that pass finds too little, a plain
   greyscale pass runs. Results only pre-fill the form — nothing saves on its own. */
/* Sampler label → fields. Tolerant of Tesseract noise ("Pcrce nt", stray "|", "SN"). */
function parseLabel(text, factories){
  const out = {};
  const lines = String(text || "").split(/\r?\n/).map(l => l.replace(/[“”"`~_—–=|\\]+/g, " ").replace(/\s+/g, " ").trim()).filter(Boolean);
  const key = l => l.toLowerCase().replace(/[^a-z0-9%:]/g, "");
  const after = l => { const i = l.indexOf(":"); return i >= 0 ? l.slice(i + 1).trim() : l.replace(/^\S+\s*(option)?\s*/i, "").trim(); };
  const num = s => s.replace(/[oO]/g, "0").replace(/[lI|]/g, "1").replace(/[sS](?=\d)|(?<=\d)[sS]/g, "5");
  let first = -1;
  lines.forEach((l, i) => {
    const k = key(l);
    let hit = true;
    if (/^.{0,3}date/.test(k)){
      const v = num(after(l)).replace(/\s+/g, "");
      let m = v.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/), d = null;
      if (m){ let y = +m[3]; if (y < 100) y += 2000; d = [y, +m[1], +m[2]]; }
      else if ((m = v.match(/(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/))) d = [+m[1], +m[2], +m[3]];
      if (d && d[1] >= 1 && d[1] <= 12 && d[2] >= 1 && d[2] <= 31) out.date = d[0] + "-" + String(d[1]).padStart(2, "0") + "-" + String(d[2]).padStart(2, "0");
    } else if (/^.{0,3}(scent)?opt[i1l]?on/.test(k) || /^.{0,3}scent(code|no|#)/.test(k)){
      const m = after(l).match(/[A-Za-z0-9][A-Za-z0-9\-\/.]*\d[A-Za-z0-9\-\/.]*|\d[A-Za-z0-9\-\/.]*/);
      if (m) out.option = m[0].replace(/[.\-\/]+$/, "");
    } else if (/^.{0,3}p[ec]r[ce]{1,2}[ec]?nt|^.{0,3}perc|^.{0,3}conc/.test(k)){
      const m = num(after(l)).replace(/\s+/g, "").match(/(\d{1,3}(?:[.,]\d+)?)%?/);
      if (m){ const n = parseFloat(m[1].replace(",", ".")); if (n >= 0 && n <= 100) out.pct = n; }
    } else if (/^.{0,3}(factory|item|fty)(code|no|#)/.test(k) || /^.{0,3}code:/.test(k)){
      const m = after(l).match(/[A-Za-z0-9][A-Za-z0-9\-\/.]*/);
      if (m) out.code = m[0];
    } else hit = false;
    if (hit && first < 0) first = i;
  });
  /* description = the lines above the first labelled line, with edge junk trimmed */
  const descLines = (first < 0 ? lines.slice(0, 2) : lines.slice(0, first)).map(l => {
    let t = l.split(" ").filter(x => /[A-Za-z0-9]/.test(x));
    const word2 = x => /^\d+$/.test(x) || /^[&+]$/.test(x) || (/^[A-Z][a-z]$/.test(x) && /[aeiouy]|^(Mr|Ms|Dr|St)$/.test(x));   // "La", "De", "7" stay; "SN", "ll", "Bl" go
    while (t.length > 1 && t[0].length <= 2 && !word2(t[0])) t.shift();
    while (t.length > 1 && t[t.length - 1].length <= 2 && !/^[A-Z][a-z]?$/.test(t[t.length - 1]) && !/^\d+$/.test(t[t.length - 1])) t.pop();
    return t.join(" ").replace(/[^A-Za-z0-9)%]+$/, "");
  }).filter(l => (l.match(/[A-Za-z]/g) || []).length >= 3);
  if (descLines.length) out.desc = descLines.join(" ");
  /* a factory named anywhere on the label */
  const flat = key(lines.join(" "));
  const f = (factories || []).find(n => { const kn = key(n); return kn.length >= 4 && flat.indexOf(kn) >= 0; });
  if (f) out.factory = f;
  return out;
}

let ocrWorker = null, ocrLoading = null, ocrProg = null;
function loadScript(src){
  return new Promise((ok, bad) => {
    const s = document.createElement("script"); s.src = src; s.onload = ok;
    s.onerror = () => bad(new Error("the label reader couldn't load (blocked network?)"));
    document.head.appendChild(s);
  });
}
function getOcr(){
  if (ocrWorker) return Promise.resolve(ocrWorker);
  if (!ocrLoading) ocrLoading = (async () => {
    if (!window.Tesseract) await loadScript(CFG.ocr.lib);
    if (CFG.ocr.langFile){                                     // seed Tesseract's own cache so it never downloads
      const r = await fetch(CFG.ocr.langFile);
      if (!r.ok) throw new Error("the label reader's language file is missing (" + r.status + ")");
      await idbPut("./eng.traineddata", new Uint8Array(await r.arrayBuffer()));
    }
    let failed;
    const dead = new Promise((_, bad) => { failed = bad; setTimeout(() => bad(new Error("the label reader didn't start")), 120000); });
    ocrWorker = await Promise.race([dead, Tesseract.createWorker("eng", 1, {
      workerPath:CFG.ocr.worker, corePath:CFG.ocr.core, langPath:new URL(CFG.ocr.lang, location.href).href,
      errorHandler:e => failed(new Error("the label reader failed to start (" + (e && e.message || e) + ")")),
      logger:m => { if (ocrProg && m && typeof m.progress === "number") ocrProg(m.status || "", m.progress); }
    })]);
    return ocrWorker;
  })().catch(e => { ocrLoading = null; throw e; });
  return ocrLoading;
}
function idbPut(key, val){                                     // idb-keyval's default store, which Tesseract reads
  return new Promise((ok, bad) => {
    const rq = indexedDB.open("keyval-store");
    rq.onupgradeneeded = () => rq.result.createObjectStore("keyval");
    rq.onerror = () => bad(rq.error);
    rq.onsuccess = () => {
      const db = rq.result, tx = db.transaction("keyval", "readwrite");
      tx.objectStore("keyval").put(val, key);
      tx.oncomplete = () => { db.close(); ok(); }; tx.onerror = () => bad(tx.error);
    };
  });
}
function ocrCanvas(img, bw){
  const sc = Math.min(1800 / Math.max(img.width, img.height), 2.5);
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  const id = x.getImageData(0, 0, c.width, c.height), d = id.data, hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4){ const g = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0; d[i] = d[i + 1] = d[i + 2] = g; hist[g]++; }
  if (bw){                                                     // Otsu threshold
    const n = c.width * c.height; let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
    let sB = 0, wB = 0, best = 0, th = 128;
    for (let t = 0; t < 256; t++){
      wB += hist[t]; if (!wB) continue; const wF = n - wB; if (!wF) break;
      sB += t * hist[t]; const v = wB * wF * Math.pow(sB / wB - (sum - sB) / wF, 2);
      if (v > best){ best = v; th = t; }
    }
    for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = d[i] > th ? 255 : 0;
  }
  x.putImageData(id, 0, 0);
  return c;
}
async function readLabel(img, factories, prog){
  ocrProg = prog;
  try {
    const w = await getOcr();
    const a = parseLabel((await w.recognize(ocrCanvas(img, true))).data.text, factories);
    if (Object.keys(a).length >= 3) return a;
    const b = parseLabel((await w.recognize(ocrCanvas(img, false))).data.text, factories);
    return Object.keys(b).length > Object.keys(a).length ? b : a;
  } finally { ocrProg = null; }
}

/* Add / edit one sampler fragrance. Staged: nothing is written until Save; Cancel
   (or Esc) backs out at any point, including mid-save. */
function openFrag(f, onDone){
  const d = $("#fDlg"), isNew = !f, users = f ? (usage().get(f.id) || []) : [];
  const st = { file:null, img:null, thumb:f ? f.thumb : "", busy:false, abort:null, armed:false, ocr:0 };
  const { bd, ft } = dlgShell(d, isNew ? "New fragrance" : "Edit fragrance", isNew ? "A sampler fragrance from a factory" : (users.length ? "Used by " + users.length + " style" + (users.length > 1 ? "s" : "") : "Not used by any style yet"));
  const row = el("div", "frow");
  const drop = el("div", "drop");
  const paint = () => {
    drop.innerHTML = "";
    if (st.thumb){ const i = el("img"); i.src = st.thumb; i.alt = ""; drop.appendChild(i); drop.appendChild(el("span", "rep", "Click, drop or paste to replace")); }
    else drop.appendChild(el("span", null, "Click, drop or paste a picture"));
  };
  const take = async file => {
    if (!file || !/^image\//.test(file.type)){ err.textContent = "That isn't an image."; return; }
    try { st.img = await decodeImage(file); st.file = file; st.thumb = thumbUrl(st.img); err.textContent = ""; paint(); }
    catch(e){ err.textContent = e.message; return; }
    runOcr(false);                                           // fills only the empty fields; "Read label again" overwrites
  };
  const ocrl = el("div", "ocrline");
  const ocrMsg = (cls, text, withCancel, withRetry) => {
    ocrl.className = "ocrline" + (cls ? " " + cls : ""); ocrl.innerHTML = "";
    if (cls === "busy") ocrl.appendChild(el("div", "spin"));
    if (text) ocrl.appendChild(el("span", null, text));
    if (withCancel){ const x = el("button", "linkbtn", "Cancel"); x.onclick = () => { st.ocr = 0; ocrMsg("", "", false, true); }; ocrl.appendChild(x); }
    if (withRetry && st.img){ const r = el("button", "linkbtn", text ? "Read label again" : "Read label from photo"); r.onclick = () => runOcr(true); ocrl.appendChild(r); }
  };
  const runOcr = async force => {
    if (!st.img) return;
    const my = ++ocrSeq; st.ocr = my;
    ocrMsg("busy", ocrWorker ? "Reading label…" : "Loading label reader…", true);
    try {
      const res = await readLabel(st.img, fragFactories(), (status, p) => {
        if (st.ocr !== my) return;
        ocrMsg("busy", /recogni/i.test(status) ? "Reading label… " + Math.round(p * 100) + "%" : "Loading label reader (first time only)…", true);
      });
      if (st.ocr !== my || !d.open) return;
      const n = fill(res, force);
      ocrMsg(n ? "ok" : "bad", n ? "Filled " + n + " field" + (n > 1 ? "s" : "") + " from the label. Check them before saving." :
        "Couldn't read the label. Try a straight, close photo, or fill it in by hand.", false, true);
    } catch(e){ console.warn("Label reader:", e); if (st.ocr === my) ocrMsg("bad", "The label reader couldn't load here. Fill it in by hand.", false, true); }
  };
  drop.onclick = () => { const i = $("#imgPick"); i.value = ""; i.onchange = () => take(i.files[0]); i.click(); };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files[0]); };
  d.onpaste = e => { const it = Array.from(e.clipboardData.items || []).find(x => /^image\//.test(x.type)); if (it){ e.preventDefault(); take(it.getAsFile()); } };
  paint();
  const dropcol = el("div", "dropcol"); dropcol.appendChild(drop); dropcol.appendChild(ocrl);
  if (isNew) ocrl.appendChild(el("span", null, "Add a photo of the label and the fields fill in."));

  const fields = el("div", "fields");
  let fac;
  const ff = fragFactories();
  if (ff.length){
    fac = el("select"); fac.appendChild(new Option("Choose factory…", ""));
    ff.forEach(n => fac.appendChild(new Option(n, n)));
    if (f && f.factory && ff.indexOf(f.factory) < 0)
      fac.appendChild(new Option(f.factory + (S.factories.indexOf(f.factory) < 0 ? " (not in Factories list)" : " (not marked fragrance)"), f.factory));
    fac.value = f ? f.factory : "";
  } else { fac = el("input"); fac.value = f ? f.factory : ""; fac.placeholder = S.facErr || "Factory"; }
  fields.appendChild(field("Factory", fac));
  if (S.factories.length && !S.facRows.some(x => x.frag)){
    const tip = el("button", "linkbtn", "Showing every factory — choose which make fragrance");
    tip.onclick = () => { d.close(); openFactories(); };
    fields.appendChild(tip);
  }
  const nm = el("input"); nm.value = f ? f.name : ""; nm.placeholder = "e.g. The 7 Virtues Coconut Sun Eau de Parfum";
  fields.appendChild(field("Description", nm));

/* ============================ BACKGROUND ============================ */
function flowField(){
  const cv = $("#flow"), ctx = cv.getContext("2d");
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W, H;
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener("resize", resize);
  let seed = 20260610;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const P = [];
  for (let i = 0; i < 70; i++) P.push({ x:rnd() * W, y:rnd() * H, s:.18 + rnd() * .34 });
  const noise = (x, y, t) => Math.sin(x * .0016 + t) + Math.cos(y * .0021 - t * .8) + Math.sin((x + y) * .0009 + t * .5);
  let t = 0;
  (function tick(){
    t += .0016;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(27,111,174,.13)";
    P.forEach(p => {
      const a = noise(p.x, p.y, t) * Math.PI;
      p.x += Math.cos(a) * p.s; p.y += Math.sin(a) * p.s;
      if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - Math.cos(a) * 7, p.y - Math.sin(a) * 7); ctx.stroke();
    });
    requestAnimationFrame(tick);
  })();
}

    return;
  }
  S.acct = acct; msalApp.setActiveAccount(acct);
  boot();
}
async function boot(){
  try {
    gateMsg('<div class="spin"></div>Loading lists…');
    await resolveSite();
    $("#whoName").textContent = S.acct.name || S.acct.username || "";
    S.missing = [CFG.listLib, CFG.listMap].filter(n => !listId(n));
    if (S.missing.length){
      $("#gate").style.display = "none"; $("#app").style.display = ""; renderAll();
      let resume = false; try { resume = sessionStorage.getItem("fl-create") === "1"; } catch(e){}
      if (resume) createLists();
      return;
    }
    const a = await resolveCols(CFG.listLib, LIB_COLS.concat(OPT_KEYS)), b = await resolveCols(CFG.listMap, MAP_COLS);
    S.cols.lib = a.out; S.cols.map = b.out;
    S.optMiss = a.miss.filter(x => OPT_KEYS.indexOf(x) >= 0); a.miss = a.miss.filter(x => OPT_KEYS.indexOf(x) < 0);   // offered as a one-click add
    const miss = a.miss.map(x => CFG.listLib + "." + x).concat(b.miss.map(x => CFG.listMap + "." + x));
    if (miss.length) throw new Error("Missing column(s): " + miss.join(", "));
    await Promise.all([loadLib(), loadMap(), loadFactories()]);
    rebuildStyles();
    $("#gate").style.display = "none"; $("#app").style.display = "";
    renderAll();
    let resumeCols = false; try { resumeCols = sessionStorage.getItem("fl-cols") === "1"; } catch(e){}
    if (S.optMiss.length && resumeCols) addMissingCols();
    applyHash();
    loadSources();
  } catch(e){
    console.error(e);
    const denied = e.status === 403 || e.status === 401;
    $("#gate").style.display = ""; $("#app").style.display = "none";
    gateMsg('<span style="color:var(--bad)">' + (denied
      ? "Signed in, but you don't have access to the Production site. Ask Saul or Judah to add you."
      : esc(e.message || "Startup failed")) + "</span>");
  }
}
start();
</script>
